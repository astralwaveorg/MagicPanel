# 仓库是公开的：一旦把用户数据（节点密码、订阅令牌、备份）提交上来，
# 泄露就发生了。这道关卡在每次推送时扫一遍，命中即失败。
name: secret-scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描仓库里的凭据与运行数据
        run: python3 scripts/check_secrets.py
      - name: 核对引擎默认配置的每个键都有官方出处
        run: python3 scripts/check_engine_defaults.py
