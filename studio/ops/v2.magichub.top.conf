server {
    listen 8443 ssl;
    server_name v2.magichub.top;
    ssl_certificate /www/sites/www.magichub.top/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/www.magichub.top/ssl/privkey.pem;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 4m;
    location / {
        proxy_pass http://127.0.0.1:47102;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 65s;
    }
}
