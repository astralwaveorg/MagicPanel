name: magicpanel-studio
services:
  studio:
    image: magicpanel-studio:${REVISION:?set REVISION}
    build:
      context: .
      args:
        REVISION: ${REVISION}
    restart: unless-stopped
    ports: ["127.0.0.1:47102:8000"]
    volumes:
      - /opt/magicpanel-v2/core:/opt/studio-core:ro
      - ${STUDIO_STATE_DIR:?set STUDIO_STATE_DIR}:/var/lib/magicpanel-studio
      - ${STUDIO_AI_KEY:?set STUDIO_AI_KEY}:/run/secrets/minimax:ro
    environment:
      STUDIO_REQUIRE_CORE: "1"
      STUDIO_ORIGIN: https://v2.magichub.top:8443
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD","python","-c","from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging:
      options: {max-size: 5m, max-file: '2'}
  subconverter-extended:
    image: ghcr.io/astralwaveorg/omnisub:v1.12.1@sha256:42edf5d85c3bf25e6812cdbfe836a742810e5277db5ad9d09c3dde4ca5a71c71
    restart: unless-stopped
    environment:
      SUBCONVERTER_SECURITY_PROFILE: strict
      SUBCONVERTER_ALLOW_PUBLIC_UPLOAD: 'false'
    logging:
      driver: none
    healthcheck:
      test: ["CMD","wget","-q","-O","/dev/null","http://127.0.0.1:25500/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
