# Stash「内置 DNS 服务」文档里给出的配置键
# 来源：https://stash.wiki/features/dns-server
# 取值取自官方示例，仅用于核对"哪些键被官方支持"。
dns:
  nameserver:
    - 'https://1.1.1.1/dns-query#h3=true'
  default-nameserver:
    - 'https://1.1.1.1/dns-query#h3=true'
  proxy-server-nameserver:
    - 223.5.5.5
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    'www.baidu.com': 114.114.114.114
    '+.internal.crop.com': system
  fallback: []
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '+.stun.*.*'
    - '*.n.n.srv.nintendo.net'
    - 'geosite:private'
  ipv6: false
  follow-rule: false
  hosts:
    '*.clash.dev': 127.0.0.1
ipv6: false
