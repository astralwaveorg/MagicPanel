# MagicPanel —— 1Panel 容器编排
# 数据持久化在 ./data（数据库、密钥、构建产物、测速核心），请纳入备份。
services:
  magicpanel:
    build:
      context: .
      # 构建期代理：NAS 刚重启时外网可能未就绪，npm/pip 拉包需要走代理。
      # 只影响镜像构建，不会进入运行时环境。
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    container_name: magicpanel
    restart: unless-stopped
    # 以宿主机属主运行，保证 bind 挂载的 ./data 可写（NAS 上 1000:1001 为首位用户）
    user: "1000:1001"
    environment:
      TZ: Asia/Shanghai
      # 面板是测速工具：测速必须走本机直连，不能经过任何代理。
      # Docker daemon 会把宿主机的代理变量注入所有容器（见
      # docs/network/测速必须直连.md），这里显式置空把它挡在容器外；
      # 需要走代理的只有"下载测速核心"，在「设置 → 核心下载代理」单独填。
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      ALL_PROXY: ""
    volumes:
      - ./data:/app/data
    ports:
      # 仅监听本机回环，由 1Panel 反向代理（OpenResty 为 host 网络）对外暴露
      - "127.0.0.1:47100:8000"
    logging:
      # 容器日志默认无上限，设备拉取会持续写访问日志，磁盘迟早被写满
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 每日备份：数据库一致性快照 + 主密钥归档，保留最近 14 份。
  # 没有备份的话，NAS 一次磁盘故障就会让所有凭据不可恢复。
  backup:
    image: python:3.12-slim
    container_name: magicpanel-backup
    restart: unless-stopped
    user: "1000:1001"
    environment:
      TZ: Asia/Shanghai
      MAGICPANEL_DATA_DIR: /app/data
      BACKUP_KEEP: "14"
      # 备份是纯本地快照，不出网；同样挡掉 daemon 注入的代理变量
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      ALL_PROXY: ""
    volumes:
      - ./data:/app/data
      - ./scripts:/scripts:ro
    entrypoint: ["bash", "/scripts/backup_loop.sh"]
